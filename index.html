<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Goal Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --bg:#0b0b0b;--panel:#141414;--border:#242424;
  --text:#eaeaea;--muted:#8a8a8a;--accent:#22c55e;--danger:#ef4444;
}
*{box-sizing:border-box;font-family:Inter,system-ui}
body{margin:0;background:var(--bg);color:var(--text)}
.container{max-width:1400px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center}
button{background:none;border:1px solid var(--border);color:var(--text);
padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
button:hover{border-color:var(--accent);color:var(--accent)}
button.active{background:var(--accent);color:#000}
.calendar{display:grid;grid-template-columns:240px repeat(31,1fr);gap:6px;margin-top:10px}
.day-label{text-align:center;font-size:11px;color:var(--muted)}
.goal-name{display:flex;align-items:center;gap:6px}
.goal-name input{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text)}
.cell{height:28px;border:1px solid var(--border);border-radius:5px;cursor:pointer}
.cell.completed{background:var(--accent)}
#auth{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center}
.auth-box{background:var(--panel);padding:20px;border-radius:10px;width:280px}
.auth-box input{width:100%;margin-bottom:10px;padding:8px;background:#000;border:1px solid var(--border);color:#fff}
.user{cursor:pointer}
.dropdown{display:none;position:absolute;background:var(--panel);border:1px solid var(--border);right:0}
.dropdown button{width:100%}
</style>
</head>

<body>

<div id="auth">
  <div class="auth-box">
    <h3>Login / Signup</h3>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Continue</button>
  </div>
</div>

<div class="container" id="app" style="display:none">
<header>
  <h2>Goal Tracker</h2>
  <div style="position:relative">
    <span class="user" onclick="toggleMenu()" id="userName"></span>
    <div class="dropdown" id="menu">
      <button onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<br>
<button onclick="addGoal()">+ Add Goal</button>
<button onclick="editModeToggle()" id="editBtn">✏️ Edit Goals</button>

<div class="calendar" id="calendar"></div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient(
  "https://dwfocuhsoarphmduekxn.supabase.co",
  "sb_publishable_353RC6ZYh5JQDqxpf8Htpg_Av-_q6s7"
);

let user, editMode=false;
const today=new Date(),year=today.getFullYear(),month=today.getMonth()+1;
const calendar=document.getElementById("calendar");

supabaseClient.auth.getSession().then(({data})=>{
  if(data.session){user=data.session.user;init()}
});

async function login(){
  const u=username.value.trim(),p=password.value;
  const email=`${u}@local.app`;
  let res=await supabaseClient.auth.signInWithPassword({email,password:p});
  if(res.error){
    res=await supabaseClient.auth.signUp({email,password:p});
    if(res.error) return alert(res.error.message);
  }
  user=res.data.user;init();
}

function init(){
  auth.style.display="none";
  app.style.display="block";
  userName.textContent="@"+user.email.split("@")[0];
  load();
}

async function load(){
  calendar.innerHTML="<div></div>";
  for(let d=1;d<=31;d++){
    const l=document.createElement("div");
    l.className="day-label";l.textContent=d;calendar.appendChild(l);
  }

  const {data:goals}=await supabaseClient
    .from("user_goals").select("*").eq("user_id",user.id).order("position");

  goals.forEach((g,i)=>{
    const name=document.createElement("div");
    name.className="goal-name";
    if(editMode){
      const inp=document.createElement("input");
      inp.value=g.name;
      inp.onchange=()=>updateGoal(g.id,inp.value);
      name.appendChild(inp);
      const del=document.createElement("button");
      del.textContent="❌";del.onclick=()=>deleteGoal(g.id);
      name.appendChild(del);
    } else name.textContent=g.name;
    calendar.appendChild(name);

    for(let d=1;d<=31;d++){
      const c=document.createElement("div");
      c.className="cell";
      c.onclick=()=>toggle(g.name,d,c);
      calendar.appendChild(c);
    }
  });

  const {data:logs}=await supabaseClient
    .from("goal_logs")
    .select("*")
    .eq("user_id",user.id)
    .eq("month",month).eq("year",year);

  logs.forEach(l=>{
    const gi=goals.findIndex(g=>g.name===l.goal_name);
    if(gi>=0){
      const idx=gi*31+(l.day-1);
      calendar.querySelectorAll(".cell")[idx]?.classList.add("completed");
    }
  });
}

async function toggle(goal,day,cell){
  const done=!cell.classList.contains("completed");
  cell.classList.toggle("completed");
  await supabaseClient.from("goal_logs").upsert({
    user_id:user.id,goal_name:goal,day,month,year,completed:done
  });
}

async function addGoal(){
  const name=prompt("Goal name?");
  if(!name) return;
  await supabaseClient.from("user_goals").insert({
    user_id:user.id,name,position:Date.now()
  });
  load();
}

async function updateGoal(id,name){
  await supabaseClient.from("user_goals").update({name}).eq("id",id);
}

async function deleteGoal(id){
  await supabaseClient.from("user_goals").delete().eq("id",id);
  load();
}

function editModeToggle(){
  editMode=!editMode;
  editBtn.classList.toggle("active",editMode);
  load();
}

function toggleMenu(){menu.style.display=menu.style.display==="block"?"none":"block"}

async function logout(){
  await supabaseClient.auth.signOut();
  location.reload();
}
</script>
</body>
</html>
