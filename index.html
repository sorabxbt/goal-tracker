<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Goal Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #141414;
      --border: #242424;
      --text: #eaeaea;
      --muted: #8a8a8a;
      --accent: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
    }

    .brand {
      font-size: 13px;
      color: var(--muted);
    }

    button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    /* NOTE VIEW */
    .note-view {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      align-items: flex-start;
    }

    .note-text {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 14px;
      color: var(--muted);
      flex: 1;
    }

    /* NOTE EDITOR */
    .note-editor {
      display: none;
      margin-bottom: 16px;
    }

    .note-editor textarea {
      width: 100%;
      height: 90px;
      resize: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      overflow-y: auto;
    }

    .note-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    /* GOAL CONTROLS */
    .goal-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    /* CALENDAR */
    .calendar {
      display: grid;
      grid-template-columns: 240px repeat(31, 1fr);
      gap: 6px;
    }

    .day-label {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .goal-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .goal-name.editable {
      cursor: pointer;
      color: var(--accent);
    }

    .goal-name input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    .delete-btn {
      border-color: var(--danger);
      color: var(--danger);
    }

    .delete-btn:hover {
      background: var(--danger);
      color: #000;
    }

    .cell {
      height: 30px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .cell.completed {
      background: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Goal Tracker</h1>
    <div class="brand">Made by sorabxbt</div>
  </header>

  <!-- NOTE VIEW -->
  <div class="note-view" id="noteView">
    <div class="note-text" id="noteText">No note added yet.</div>
    <button id="editNoteBtn">Edit Note</button>
  </div>

  <!-- NOTE EDITOR -->
  <div class="note-editor" id="noteEditor">
    <textarea id="noteInput" placeholder="Write your note..."></textarea>
    <div class="note-actions">
      <button id="saveNote">Save</button>
      <button id="cancelNote">Cancel</button>
    </div>
  </div>

  <!-- GOAL CONTROLS -->
  <div class="goal-controls">
    <button id="addGoal">+ Add Goal</button>
    <button id="toggleEdit">✏️ Edit Goals</button>
  </div>

  <div class="calendar" id="calendar"></div>
</div>

<script>
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const goalsKey = `goals-${year}-${month}`;
  const noteKey = `note-${year}-${month}`;

  let goals = JSON.parse(localStorage.getItem(goalsKey)) || ["Reading", "Fitness"];
  let editMode = false;

  const calendar = document.getElementById("calendar");
  const toggleEditBtn = document.getElementById("toggleEdit");
  const editNoteBtn = document.getElementById("editNoteBtn");

  /* NOTE LOGIC */
  const noteText = document.getElementById("noteText");
  const noteInput = document.getElementById("noteInput");
  const noteView = document.getElementById("noteView");
  const noteEditor = document.getElementById("noteEditor");

  const savedNote = localStorage.getItem(noteKey);
  if (savedNote) noteText.textContent = savedNote;

  editNoteBtn.onclick = () => {
    editNoteBtn.classList.add("active");
    noteInput.value = noteText.textContent === "No note added yet." ? "" : noteText.textContent;
    noteView.style.display = "none";
    noteEditor.style.display = "block";
    noteInput.focus();
  };

  document.getElementById("saveNote").onclick = () => {
    const val = noteInput.value.trim() || "No note added yet.";
    localStorage.setItem(noteKey, val);
    noteText.textContent = val;
    noteEditor.style.display = "none";
    noteView.style.display = "flex";
    editNoteBtn.classList.remove("active");
  };

  document.getElementById("cancelNote").onclick = () => {
    noteEditor.style.display = "none";
    noteView.style.display = "flex";
    editNoteBtn.classList.remove("active");
  };

  noteInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      document.getElementById("saveNote").click();
    }
    if (e.key === "Escape") {
      e.preventDefault();
      document.getElementById("cancelNote").click();
    }
  });

  /* GOALS */
  function saveGoals() {
    localStorage.setItem(goalsKey, JSON.stringify(goals));
  }

  function render() {
    calendar.innerHTML = "";
    calendar.appendChild(document.createElement("div"));

    for (let d = 1; d <= daysInMonth; d++) {
      const lbl = document.createElement("div");
      lbl.className = "day-label";
      lbl.textContent = d;
      calendar.appendChild(lbl);
    }

    goals.forEach((goal, index) => {
      const name = document.createElement("div");
      name.className = "goal-name" + (editMode ? " editable" : "");

      const label = document.createElement("span");
      label.textContent = goal;

      if (editMode) {
        label.onclick = () => {
          const input = document.createElement("input");
          input.value = goal;
          name.innerHTML = "";
          name.appendChild(input);
          input.focus();

          input.onblur = () => {
            goals[index] = input.value.trim() || "Untitled Goal";
            saveGoals();
            render();
          };
        };
      }

      name.appendChild(label);

      if (editMode) {
        const del = document.createElement("button");
        del.textContent = "🗑";
        del.className = "delete-btn";
        del.onclick = () => {
          if (confirm(`Delete "${goal}" ?`)) {
            goals.splice(index, 1);
            saveGoals();
            render();
          }
        };
        name.appendChild(del);
      }

      calendar.appendChild(name);

      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.onclick = () => cell.classList.toggle("completed");
        calendar.appendChild(cell);
      }
    });
  }

  document.getElementById("addGoal").onclick = () => {
    goals.push("New Goal");
    saveGoals();
    render();
  };

  toggleEditBtn.onclick = () => {
    editMode = !editMode;
    toggleEditBtn.classList.toggle("active", editMode);
    toggleEditBtn.textContent = editMode ? "✔ Done Editing" : "✏️ Edit Goals";
    render();
  };

  render();
</script>

</body>
</html>
