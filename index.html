<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Goal Tracker</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body {
      background:#0b0b0b;
      color:#fff;
      font-family:Arial;
      margin:0;
      padding:20px;
    }
    .box {
      max-width:600px;
      margin:auto;
      background:#141414;
      padding:20px;
      border-radius:10px;
    }
    input, button {
      width:100%;
      padding:10px;
      margin:6px 0;
      border-radius:6px;
      border:none;
    }
    button {
      background:#22c55e;
      font-weight:bold;
      cursor:pointer;
    }
    .goal {
      display:flex;
      justify-content:space-between;
      background:#1f1f1f;
      padding:10px;
      margin-top:8px;
      border-radius:6px;
    }
    .logout {
      background:#ef4444;
    }
  </style>
</head>

<body>

<div class="box" id="authBox">
  <h2>Login / Signup</h2>
  <input id="username" placeholder="Username" />
  <input id="password" type="password" placeholder="Password" />
  <button onclick="login()">Login / Signup</button>
</div>

<div class="box" id="appBox" style="display:none">
  <h2>Goal Tracker</h2>
  <div id="userLabel"></div>

  <input id="goalInput" placeholder="New Goal" />
  <button onclick="addGoal()">Add Goal</button>

  <div id="goals"></div>

  <button class="logout" onclick="logout()">Logout</button>
</div>

<script>
/* ================== CONFIG ================== */
const supabase = supabase.createClient(
  "https://dwfocuhsoarphmduekxn.supabase.co",
  "sb_publishable_353RC6ZYh5JQDqxpf8Htpg_Av-_q6s7"
)

/* ================== AUTH ================== */
async function login() {
  const username = document.getElementById("username").value.trim()
  const password = document.getElementById("password").value.trim()
  if (!username || !password) return alert("Fill all fields")

  const email = username + "@app.local"

  let { error } = await supabase.auth.signInWithPassword({
    email, password
  })

  if (error) {
    const { error: signupError } = await supabase.auth.signUp({
      email, password
    })
    if (signupError) return alert(signupError.message)
  }
}

async function logout() {
  await supabase.auth.signOut()
  location.reload()
}

/* ================== GOALS ================== */
async function loadGoals() {
  const user = (await supabase.auth.getUser()).data.user
  if (!user) return

  document.getElementById("userLabel").innerText =
    "Logged in as: " + user.email.split("@")[0]

  const { data } = await supabase
    .from("user_goals")
    .select("*")
    .order("id")

  const box = document.getElementById("goals")
  box.innerHTML = ""

  data.forEach(g => {
    const div = document.createElement("div")
    div.className = "goal"
    div.innerHTML = `
      <span>${g.name}</span>
      <button onclick="deleteGoal(${g.id})">❌</button>
    `
    box.appendChild(div)
  })
}

async function addGoal() {
  const name = document.getElementById("goalInput").value.trim()
  if (!name) return

  const user = (await supabase.auth.getUser()).data.user

  await supabase.from("user_goals").insert({
    name,
    user_id: user.id
  })

  document.getElementById("goalInput").value = ""
  loadGoals()
}

async function deleteGoal(id) {
  await supabase.from("user_goals").delete().eq("id", id)
  loadGoals()
}

/* ================== SESSION ================== */
supabase.auth.onAuthStateChange((_, session) => {
  if (session) {
    document.getElementById("authBox").style.display = "none"
    document.getElementById("appBox").style.display = "block"
    loadGoals()
  }
})

</script>
</body>
</html>
