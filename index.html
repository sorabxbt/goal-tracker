<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Goal Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --bg:#0b0b0b; --panel:#141414; --border:#242424;
  --text:#eaeaea; --muted:#8a8a8a;
  --accent:#22c55e; --danger:#ef4444;
}
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}
.container{max-width:1400px;margin:auto;padding:24px}
button{background:none;border:1px solid var(--border);color:var(--text);
padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
button:hover{border-color:var(--accent);color:var(--accent)}
button.active{background:var(--accent);color:#000}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}

.user-box{position:relative}
.avatar{width:28px;height:28px;border-radius:50%;background:#22c55e;
display:flex;align-items:center;justify-content:center;color:#000;cursor:pointer}
.dropdown{display:none;position:absolute;right:0;top:36px;
background:#141414;border:1px solid #242424;border-radius:6px}
.dropdown button{border:none;width:100%;text-align:left}

.note-view,.note-editor{background:var(--panel);border:1px solid var(--border);
border-radius:8px;padding:12px;margin-bottom:12px}
.note-editor textarea{width:100%;height:120px;background:var(--panel);
border:1px solid var(--border);color:var(--text);resize:vertical}

.goal-controls{display:flex;gap:8px;margin-bottom:12px}
.calendar{display:grid;grid-template-columns:240px repeat(31,1fr);gap:6px}
.day-label{text-align:center;font-size:12px;color:var(--muted)}
.goal-name{display:flex;gap:6px;align-items:center}
.goal-name.editable{color:var(--accent);cursor:pointer}
.cell{height:28px;border:1px solid var(--border);border-radius:6px;cursor:pointer}
.cell.completed{background:var(--accent)}

#auth{position:fixed;inset:0;background:#000d;display:flex;
align-items:center;justify-content:center}
.auth-box{background:#141414;padding:20px;border-radius:8px;width:260px}
.auth-box input{width:100%;margin-bottom:8px;padding:6px}
</style>
</head>

<body>

<div id="auth">
  <div class="auth-box">
    <h3>Login / Register</h3>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Continue</button>
  </div>
</div>

<div class="container" id="app" style="display:none">
<header>
  <h2>Goal Tracker</h2>
  <div class="user-box">
    <div class="avatar" id="avatar"></div>
    <div class="dropdown" id="menu">
      <button id="logout">Logout</button>
    </div>
  </div>
</header>

<div class="note-view" id="noteView">
  <div id="noteText">No note yet</div>
  <button id="editNote">Edit</button>
</div>

<div class="note-editor" id="noteEditor" style="display:none">
  <textarea id="noteInput"></textarea>
  <button id="saveNote">Save</button>
</div>

<div class="goal-controls">
  <button id="addGoal">+ Add Goal</button>
  <button id="toggleEdit">✏️ Edit Goals</button>
</div>

<div class="calendar" id="calendar"></div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient(
  "https://dwfocuhsoarphmduekxn.supabase.co",
  "sb_publishable_353RC6ZYh5JQDqxpf8Htpg_Av-_q6s7"
);

const authBox=document.getElementById("auth");
const app=document.getElementById("app");
const avatar=document.getElementById("avatar");
const menu=document.getElementById("menu");
const calendar=document.getElementById("calendar");

avatar.onclick=()=>menu.style.display=menu.style.display==="block"?"none":"block";
logout.onclick=async()=>{await supabaseClient.auth.signOut();location.reload()};

loginBtn.onclick=async()=>{
  const u=username.value.trim();
  const p=password.value;
  if(!u||!p)return;
  const email=`${u}@app.local`;
  let {error}=await supabaseClient.auth.signInWithPassword({email,password:p});
  if(error){
    await supabaseClient.auth.signUp({email,password:p});
  }
};

supabaseClient.auth.onAuthStateChange(async(_,session)=>{
  if(!session)return;
  authBox.style.display="none";
  app.style.display="block";
  avatar.textContent=session.user.email[0].toUpperCase();
  render();
});

const today=new Date();
const year=today.getFullYear(),month=today.getMonth();
let editMode=false;

async function loadGoals(){
  const {data}=await supabaseClient
    .from("user_goals")
    .select("*")
    .order("position");
  return data||[];
}

async function render(){
  calendar.innerHTML="";
  calendar.appendChild(document.createElement("div"));
  for(let d=1;d<=31;d++){
    const l=document.createElement("div");
    l.className="day-label";l.textContent=d;calendar.appendChild(l);
  }

  const goals=await loadGoals();
  for(const g of goals){
    const name=document.createElement("div");
    name.className="goal-name"+(editMode?" editable":"");
    name.textContent=g.name;

    if(editMode){
      name.onclick=async()=>{
        const n=prompt("Rename goal",g.name);
        if(n)await supabaseClient.from("user_goals")
          .update({name:n}).eq("id",g.id);
        render();
      };
      const del=document.createElement("button");
      del.textContent="🗑";
      del.onclick=async()=>{
        await supabaseClient.from("user_goals").delete().eq("id",g.id);
        render();
      };
      name.appendChild(del);
    }

    calendar.appendChild(name);

    for(let d=1;d<=31;d++){
      const c=document.createElement("div");
      c.className="cell";
      c.onclick=async()=>{
        c.classList.toggle("completed");
        await supabaseClient.from("goal_logs").upsert({
          user_id:(await supabaseClient.auth.getUser()).data.user.id,
          goal_name:g.name,day:d,month,year,
          completed:c.classList.contains("completed")
        });
      };
      calendar.appendChild(c);
    }
  }
}

addGoal.onclick=async()=>{
  const user=(await supabaseClient.auth.getUser()).data.user;
  await supabaseClient.from("user_goals").insert({
    user_id:user.id,name:"New Goal",position:Date.now()
  });
  render();
};

toggleEdit.onclick=e=>{
  editMode=!editMode;
  e.target.classList.toggle("active",editMode);
  render();
};
</script>
</body>
</html>
