<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Goal Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: #eaeaea;
      font-family: system-ui, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .calendar {
      display: grid;
      grid-template-columns: 200px repeat(30, 1fr);
      gap: 6px;
    }

    .day-label {
      text-align: center;
      font-size: 12px;
      color: #888;
    }

    .goal-name {
      display: flex;
      align-items: center;
      font-size: 14px;
    }

    .cell {
      height: 26px;
      background: #141414;
      border: 1px solid #242424;
      border-radius: 6px;
      cursor: pointer;
    }

    .cell.completed {
      background: #22c55e;
      border-color: #22c55e;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Goal Tracker</h1>
  <div class="calendar" id="calendar"></div>
</div>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
  /* 🔑 SUPABASE CONFIG (already filled) */
  const supabaseUrl = "https://dwfocuhsoarphmduekxn.supabase.co";
  const supabaseKey = "sb_publishable_353RC6ZYh5JQDqxpf8Htpg_Av-_q6s7";
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  /* 📅 DATE INFO */
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const daysInMonth = 30;

  /* 🎯 GOALS */
  const goals = ["Reading", "Fitness"];
  const calendar = document.getElementById("calendar");

  /* 🎨 RENDER UI */
  function render() {
    calendar.innerHTML = "";
    calendar.appendChild(document.createElement("div"));

    for (let d = 1; d <= daysInMonth; d++) {
      const lbl = document.createElement("div");
      lbl.className = "day-label";
      lbl.textContent = d;
      calendar.appendChild(lbl);
    }

    goals.forEach(goal => {
      const name = document.createElement("div");
      name.className = "goal-name";
      name.textContent = goal;
      calendar.appendChild(name);

      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement("div");
        cell.className = "cell";

        cell.onclick = async () => {
          const done = !cell.classList.contains("completed");
          cell.classList.toggle("completed");

          await supabase.from("goal_logs").upsert({
            goal_name: goal,
            day: d,
            month: month,
            year: year,
            completed: done
          });
        };

        calendar.appendChild(cell);
      }
    });
  }

  /* 🔄 LOAD SAVED DATA */
  async function loadCompleted() {
    const { data } = await supabase
      .from("goal_logs")
      .select("*")
      .eq("month", month)
      .eq("year", year);

    if (!data) return;

    const cells = document.querySelectorAll(".cell");

    data.forEach(row => {
      if (!row.completed) return;

      const gIndex = goals.indexOf(row.goal_name);
      if (gIndex === -1) return;

      const index = gIndex * daysInMonth + (row.day - 1);
      if (cells[index]) {
        cells[index].classList.add("completed");
      }
    });
  }

  render();
  loadCompleted();
</script>

</body>
</html>
