<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Goal Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --bg:#0b0b0b;
  --panel:#141414;
  --border:#242424;
  --text:#eaeaea;
  --muted:#8a8a8a;
  --accent:#22c55e;
  --danger:#ef4444;
}
*{box-sizing:border-box;font-family:system-ui,Inter,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}
.container{max-width:1400px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
button{background:none;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.active{background:var(--accent);color:#000}
.calendar{display:grid;grid-template-columns:240px repeat(31,1fr);gap:6px}
.day{font-size:11px;color:var(--muted);text-align:center}
.goal-name{display:flex;gap:6px;align-items:center}
.goal-name.editable{color:var(--accent);cursor:pointer}
.cell{height:26px;border:1px solid var(--border);border-radius:6px;cursor:pointer}
.cell.done{background:var(--accent)}
input,textarea{background:#000;color:#fff;border:1px solid var(--border);border-radius:6px;padding:6px}
.auth{max-width:300px;margin:100px auto;background:var(--panel);padding:20px;border-radius:8px}
.auth input{width:100%;margin-bottom:8px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth" class="auth" style="display:none">
  <h3>Login / Signup</h3>
  <input id="email" placeholder="email" />
  <input id="password" type="password" placeholder="password" />
  <button onclick="login()">Login / Signup</button>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none">
  <header>
    <h2>Goal Tracker</h2>
    <div>
      <span id="username"></span>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- NOTE -->
  <div style="background:var(--panel);padding:12px;border-radius:8px;margin-bottom:10px">
    <div id="noteText">No note added yet.</div>
    <button onclick="editNote()">Edit Note</button>
  </div>
  <div id="noteEditor" style="display:none;margin-bottom:10px">
    <textarea id="noteInput" style="width:100%;height:90px"></textarea><br><br>
    <button onclick="saveNote()">Save</button>
  </div>

  <div style="margin-bottom:10px">
    <button onclick="addGoal()">+ Add Goal</button>
    <button id="editBtn" onclick="toggleEdit()">✏ Edit Goals</button>
  </div>

  <div class="calendar" id="calendar"></div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
/* SUPABASE */
const supabaseClient = supabase.createClient(
  "https://dwfocuhsoarphmduekxn.supabase.co",
  "sb_publishable_353RC6ZYh5JQDqxpf8Htpg_Av-_q6s7"
);

let user=null, goals=[], editMode=false;
const today=new Date();
const year=today.getFullYear();
const month=today.getMonth();
const days=new Date(year,month+1,0).getDate();

/* AUTH */
async function checkAuth(){
  const {data}=await supabaseClient.auth.getSession();
  if(data.session){
    user=data.session.user;
    showApp();
  }else{
    auth.style.display="block";
  }
}
checkAuth();

async function login(){
  const email=emailInput.value;
  const password=passwordInput.value;
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){
    await supabaseClient.auth.signUp({email,password});
  }
  location.reload();
}
async function logout(){
  await supabaseClient.auth.signOut();
  location.reload();
}

/* UI */
function showApp(){
  auth.style.display="none";
  app.style.display="block";
  username.textContent="@"+user.email.split("@")[0];
  loadGoals();
  loadNote();
}

/* NOTES (localStorage) */
function noteKey(){return `note-${user.id}-${year}-${month}`}
function loadNote(){
  const n=localStorage.getItem(noteKey());
  if(n) noteText.textContent=n;
}
function editNote(){
  noteEditor.style.display="block";
  noteInput.value=localStorage.getItem(noteKey())||"";
}
function saveNote(){
  localStorage.setItem(noteKey(),noteInput.value);
  noteEditor.style.display="none";
  loadNote();
}

/* GOALS */
async function loadGoals(){
  const {data}=await supabaseClient.from("user_goals")
    .select("*").order("position");
  goals=data||[];
  render();
  loadTicks();
}

async function addGoal(){
  const name=prompt("Goal name?");
  if(!name)return;
  await supabaseClient.from("user_goals").insert({name,position:Date.now()});
  loadGoals();
}

async function deleteGoal(id){
  await supabaseClient.from("user_goals").delete().eq("id",id);
  loadGoals();
}

function toggleEdit(){
  editMode=!editMode;
  editBtn.classList.toggle("active",editMode);
  render();
}

/* CALENDAR */
function render(){
  calendar.innerHTML="";
  calendar.appendChild(document.createElement("div"));
  for(let d=1;d<=days;d++){
    const x=document.createElement("div");
    x.className="day";x.textContent=d;
    calendar.appendChild(x);
  }
  goals.forEach(g=>{
    const name=document.createElement("div");
    name.className="goal-name"+(editMode?" editable":"");
    name.textContent=g.name;
    if(editMode){
      name.onclick=()=>deleteGoal(g.id);
    }
    calendar.appendChild(name);
    for(let d=1;d<=days;d++){
      const c=document.createElement("div");
      c.className="cell";
      c.onclick=()=>toggleTick(g.name,d,c);
      calendar.appendChild(c);
    }
  });
}

/* TICKS */
async function toggleTick(goal,day,cell){
  const done=!cell.classList.contains("done");
  cell.classList.toggle("done");
  await supabaseClient.from("goal_logs").upsert({
    goal_name:goal,day,month,year,completed:done
  });
}
async function loadTicks(){
  const {data}=await supabaseClient.from("goal_logs")
    .select("*").eq("month",month).eq("year",year);
  if(!data)return;
  const cells=[...document.querySelectorAll(".cell")];
  data.forEach(r=>{
    if(!r.completed)return;
    const gi=goals.findIndex(g=>g.name===r.goal_name);
    if(gi<0)return;
    const idx=gi*days+(r.day-1);
    cells[idx]?.classList.add("done");
  });
}
</script>
</body>
</html>
