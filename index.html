<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goal Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
--bg:#0b0b0b;--panel:#141414;--border:#242424;
--text:#eaeaea;--muted:#8a8a8a;--accent:#22c55e;
}
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:var(--bg);color:var(--text)}
.container{max-width:1400px;margin:auto;padding:24px;display:none}

header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}

button{
background:none;border:1px solid var(--border);color:var(--text);
padding:6px 12px;border-radius:6px;cursor:pointer
}
button.active{background:var(--accent);color:#000}

.note-view,.note-editor{
background:var(--panel);border:1px solid var(--border);
border-radius:8px;padding:12px;margin-bottom:12px
}
.note-editor{display:none}

.calendar{
display:grid;
grid-template-columns:240px repeat(31,minmax(22px,1fr));
gap:6px;overflow-x:auto
}
.day-label{text-align:center;font-size:12px;color:var(--muted)}
.goal-name{display:flex;align-items:center;gap:8px}
.cell{
height:30px;background:var(--panel);
border:1px solid var(--border);border-radius:6px;cursor:pointer
}
.cell.completed{background:var(--accent);border-color:var(--accent)}

/* AUTH */
#authOverlay{
position:fixed;inset:0;background:#000c;
display:flex;align-items:center;justify-content:center
}
#authBox{
background:var(--panel);border:1px solid var(--border);
padding:24px;border-radius:12px;width:280px
}
#authBox input{
width:100%;padding:8px;margin-bottom:10px;
background:#000;border:1px solid var(--border);
color:var(--text);border-radius:6px
}

/* USER MENU */
#userMenu{position:relative;cursor:pointer}
#avatar{
width:34px;height:34px;border-radius:50%;
background:var(--accent);color:#000;
display:flex;align-items:center;justify-content:center;
font-weight:bold
}
#dropdown{
display:none;position:absolute;right:0;top:42px;
background:var(--panel);border:1px solid var(--border);
border-radius:8px;padding:8px;min-width:120px
}
#dropdown div{font-size:13px;margin-bottom:6px}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authOverlay">
  <div id="authBox">
    <h3>Login / Create ID</h3>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button id="authBtn">Continue</button>
  </div>
</div>

<!-- APP -->
<div class="container" id="app">

<header>
  <h1>Goal Tracker</h1>
  <div id="userMenu">
    <div id="avatar"></div>
    <div id="dropdown">
      <div id="usernameLabel"></div>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<div class="note-view" id="noteView">
  <div id="noteText">No note added yet.</div>
  <button id="editNoteBtn">Edit Note</button>
</div>

<div class="note-editor" id="noteEditor">
  <textarea id="noteInput"></textarea>
  <button id="saveNote">Save</button>
</div>

<div style="margin-bottom:12px">
  <button id="addGoal">+ Add Goal</button>
  <button id="toggleEdit">✏️ Edit Goals</button>
</div>

<div class="calendar" id="calendar"></div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=supabase.createClient(
"https://dwfocuhsoarphmduekxn.supabase.co",
"sb_publishable_353RC6ZYh5JQDqxpf8Htpg_Av-_q6s7"
);

let currentUser=null;
const app=document.getElementById("app");
const authOverlay=document.getElementById("authOverlay");
const calendar=document.getElementById("calendar");

function toEmail(u){return u.toLowerCase()+"@goaltracker.local"}

/* AUTO LOGIN ON REFRESH */
(async()=>{
const {data}=await supabaseClient.auth.getSession();
if(data.session){
currentUser=data.session.user;
startApp();
}
})();

/* AUTH */
authBtn.onclick=async()=>{
const u=username.value.trim();
const p=password.value;
if(!u||!p)return alert("Enter username & password");

let {data,error}=await supabaseClient.auth.signInWithPassword({
email:toEmail(u),password:p
});

if(error){
const s=await supabaseClient.auth.signUp({
email:toEmail(u),password:p
});
if(s.error)return alert("Wrong password");
data=s.data;
}
currentUser=data.user;
startApp();
};

function startApp(){
authOverlay.style.display="none";
app.style.display="block";
initUserUI();
render();
}

/* USER MENU */
function initUserUI(){
const uname=currentUser.email.split("@")[0];
avatar.textContent=uname[0].toUpperCase();
usernameLabel.textContent=uname;

userMenu.onclick=()=>{
dropdown.style.display=
dropdown.style.display==="block"?"none":"block";
};
}

logoutBtn.onclick=async()=>{
await supabaseClient.auth.signOut();
location.reload();
};

/* APP LOGIC */
const today=new Date();
const year=today.getFullYear();
const month=today.getMonth();
const daysInMonth=new Date(year,month+1,0).getDate();

let goals=["Reading","Fitness"];
let editMode=false;

async function loadCompleted(){
const {data}=await supabaseClient.from("goal_logs")
.select("*").eq("user_id",currentUser.id)
.eq("month",month).eq("year",year);

if(!data)return;
const cells=document.querySelectorAll(".cell");
data.forEach(r=>{
if(!r.completed)return;
const gi=goals.indexOf(r.goal_name);
cells[gi*daysInMonth+(r.day-1)]?.classList.add("completed");
});
}

function render(){
calendar.innerHTML="";
calendar.appendChild(document.createElement("div"));

for(let d=1;d<=daysInMonth;d++){
const l=document.createElement("div");
l.className="day-label";l.textContent=d;
calendar.appendChild(l);
}

goals.forEach(goal=>{
const g=document.createElement("div");
g.className="goal-name";g.textContent=goal;
calendar.appendChild(g);

for(let d=1;d<=daysInMonth;d++){
const c=document.createElement("div");
c.className="cell";
c.onclick=async()=>{
const done=!c.classList.contains("completed");
c.classList.toggle("completed");
await supabaseClient.from("goal_logs").upsert({
user_id:currentUser.id,
goal_name:goal,day:d,month,year,completed:done
});
};
calendar.appendChild(c);
}
});
loadCompleted();
}

/* EDIT GOALS */
toggleEdit.onclick=()=>{
editMode=!editMode;
toggleEdit.classList.toggle("active",editMode);
toggleEdit.textContent=editMode?"✔ Done Editing":"✏️ Edit Goals";
};

/* NOTES */
editNoteBtn.onclick=()=>{
noteInput.value=noteText.textContent==="No note added yet."?"":noteText.textContent;
noteView.style.display="none";
noteEditor.style.display="block";
};

saveNote.onclick=()=>{
noteText.textContent=noteInput.value||"No note added yet.";
noteEditor.style.display="none";
noteView.style.display="flex";
};

addGoal.onclick=()=>{
goals.push("New Goal");
render();
};
</script>

</body>
</html>
